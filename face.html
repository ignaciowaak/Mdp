<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Demo de reconocimiento</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
        }

        body {
            min-height: 100vh;
            background: #ffffff;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 410px;
            min-height: 100vh;

            padding: 40px 28px 24px;

            display: flex;
            flex-direction: column;
        }

        .header-section {
            display: flex;
            align-items: center;
            gap: 16px;

            margin-bottom: 24px;
        }

        .avatar {
            width: 58px;
            height: 58px;

            border-radius: 50%;
            overflow: hidden;

            background: #ff8c00;

            flex-shrink: 0;
        }

        .avatar svg {
            width: 100%;
            height: 100%;
        }

        .greeting {
            font-size: 26px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 16px;
            margin-bottom: 36px;
        }

        .pin-indicators {
            width: 100%;

            display: flex;
            justify-content: space-between;

            padding: 0 10px;

            margin-bottom: 35px;
        }

        .pin-line {
            width: 36px;
            height: 2px;

            background: #111111;

            border-radius: 10px;
        }

        .recovery-link {
            width: 100%;

            text-align: center;

            color: #6a1b9a;

            text-decoration: none;

            font-size: 15px;
            font-weight: 600;

            margin-bottom: 40px;
        }

        .face-id-btn {
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 10px;

            padding: 10px;

            border: 0;
            background: transparent;

            color: #6a1b9a;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;
        }

        .face-id-btn svg {
            width: 22px;
            height: 22px;

            fill: #6a1b9a;
        }


        /* =========================================
           OVERLAY
        ========================================= */

        .face-modal-overlay {
            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, .45);

            display: flex;

            justify-content: center;
            align-items: flex-start;

            padding-top: 130px;

            opacity: 0;
            visibility: hidden;

            transition:
                opacity .25s ease,
                visibility .25s ease;

            z-index: 1000;
        }

        .face-modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }


        /* =========================================
           CONTENEDOR
        ========================================= */

        .canvas {
            width: 100px;
            height: 100px;

            display: flex;

            justify-content: center;
            align-items: center;
        }


        .face-id-wrapper {
            position: relative;

            width: 80px;
            height: 80px;

            display: flex;

            justify-content: center;
            align-items: center;

            opacity: 0;

            transform: scale(.8);

            transition:
                opacity .25s ease,
                transform .35s
                cubic-bezier(
                    .175,
                    .885,
                    .32,
                    1.275
                );
        }

        .face-modal-overlay.active
        .face-id-wrapper {
            opacity: 1;

            transform: scale(1);
        }


        /* =========================================
           CARA
        ========================================= */

        .face-id-default {
            position: absolute;

            width: 30px;
            height: 30px;

            z-index: 5;

            stroke: #ffffff;

            pointer-events: none;
        }


        /* =========================================
           ANILLOS
        ========================================= */

        .circle {
            position: absolute;

            width: 70px;
            height: 70px;

            border-radius: 50%;

            border: 3px solid #00e676;

            opacity: 0;

            pointer-events: none;
        }

        .face-id-wrapper.active
        .circle {
            opacity: 1;
        }


        .circle.green,
        .circle.blue,
        .circle.purple {
            border-color: #00e676;
        }


        /* =========================================
           FASE 1 — GIRO FLUIDO MEJORADO
        ========================================= */

        .face-id-wrapper.active {
            animation:
                faceScanSmooth 2.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes faceScanSmooth {
            0% {
                transform: scale(1) rotate(0deg);
            }
            25% {
                transform: scale(1) rotate(90deg);
            }
            50% {
                transform: scale(1) rotate(210deg);
            }
            75% {
                transform: scale(1) rotate(420deg);
            }
            90% {
                transform: scale(1.04) rotate(600deg);
            }
            100% {
                transform: scale(1) rotate(720deg);
            }
        }


        /* =========================================
           EFECTO DE LUZ
        ========================================= */

        .face-id-wrapper.active::after {
            content: "";

            position: absolute;

            width: 76px;
            height: 76px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(0, 230, 118, .18),
                    transparent 70%
                );

            animation:
                scanGlow 1s ease-in-out infinite;

            pointer-events: none;
        }

        @keyframes scanGlow {

            0% {
                opacity: .2;
                transform: scale(.85);
            }

            50% {
                opacity: .9;
                transform: scale(1.12);
            }

            100% {
                opacity: .2;
                transform: scale(.85);
            }
        }


        /* =========================================
           FINAL
        ========================================= */

        .face-id-wrapper.completed {
            animation:
                completePulse .35s ease-out forwards;
        }

        @keyframes completePulse {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }


        .face-id-wrapper.completed .circle {
            opacity: 1;

            border-color: #00e676;

            transform: scale(1.03);
        }


        /* =========================================
           CHECK
        ========================================= */

        .face-id-check {
            position: absolute;

            width: 62px;
            height: 62px;

            z-index: 20;

            pointer-events: none;
        }

        .path-tick {
            opacity: 0;

            stroke-dasharray:
                49.497474670410156;

            stroke-dashoffset:
                49.497474670410156;
        }

        .face-id-wrapper.completed
        .path-tick {
            opacity: 1;

            animation:
                drawCheck .55s
                cubic-bezier(
                    .65,
                    0,
                    .35,
                    1
                )
                forwards;
        }

        @keyframes drawCheck {

            0% {
                stroke-dashoffset:
                    49.497474670410156;
            }

            100% {
                stroke-dashoffset: 0;
            }
        }

    </style>
</head>

<body>


    <div class="app-container">

        <div class="header-section">

            <div class="avatar">

                <svg viewBox="0 0 100 100">

                    <circle
                        cx="50"
                        cy="50"
                        r="50"
                        fill="#ff8c00"
                    />

                    <path
                        d="M22,28 L10,10 L34,20 Z"
                        fill="#e65100"
                    />

                    <path
                        d="M78,28 L90,10 L66,20 Z"
                        fill="#e65100"
                    />

                    <path
                        d="
                            M50,14 L50,30
                            M38,18 L44,28
                            M62,18 L56,28
                        "
                        stroke="#261200"
                        stroke-width="4.5"
                        stroke-linecap="round"
                    />

                    <circle
                        cx="34"
                        cy="45"
                        r="6"
                        fill="#261200"
                    />

                    <circle
                        cx="66"
                        cy="45"
                        r="6"
                        fill="#261200"
                    />

                    <circle
                        cx="36"
                        cy="43"
                        r="2"
                        fill="#fff"
                    />

                    <circle
                        cx="68"
                        cy="43"
                        r="2"
                        fill="#fff"
                    />

                    <polygon
                        points="50,55 43,64 57,64"
                        fill="#261200"
                    />

                    <path
                        d="
                            M50,64 L50,73
                            M50,73
                            C45,73 43,69 40,69
                            M50,73
                            C55,73 57,69 60,69
                        "
                        stroke="#261200"
                        stroke-width="3"
                        fill="none"
                        stroke-linecap="round"
                    />

                </svg>

            </div>

            <h1 class="greeting">
                Hola
            </h1>

        </div>


        <div class="subtitle">
            Ingresá con tu clave
        </div>


        <div class="pin-indicators">

            <div class="pin-line"></div>
            <div class="pin-line"></div>
            <div class="pin-line"></div>
            <div class="pin-line"></div>
            <div class="pin-line"></div>
            <div class="pin-line"></div>

        </div>


        <a
            href="#"
            class="recovery-link"
        >
            ¿Olvidaste tu clave?
        </a>


        <button
            id="faceBtn"
            class="face-id-btn"
            type="button"
        >

            <svg viewBox="0 0 24 24">

                <path d="
                    M9 3H5
                    a2 2 0 0 0-2 2
                    v4h2V5h4V3

                    m6 0h4
                    a2 2 0 0 1 2 2
                    v4h-2V5h-4V3

                    M3 15v4
                    a2 2 0 0 0 2 2
                    h4v-2H5v-4H3

                    m18 0v4
                    h-4v2h4
                    a2 2 0 0 0 2-2
                    v-4h-2
                "/>

            </svg>

            Reconocimiento facial

        </button>

    </div>


    <!-- =========================================
         FACE ID DEMO
    ========================================= -->

    <div
        id="faceModal"
        class="face-modal-overlay"
    >

        <div class="canvas">

            <div
                id="faceId"
                class="face-id-wrapper"
            >

                <!-- CARA -->

                <svg
                    class="face-id-default"
                    viewBox="0 0 30 30"
                >

                    <path
                        d="
                            M12.062 20
                            c.688.5 1.688 1 2.938 1
                            s2.25-.5 2.938-1

                            M20 12v2
                            M10 12v2
                            M15 12v4
                            a1 1 0 0 1-1 1
                        "
                        fill="none"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />

                    <g
                        fill="none"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <path
                            d="
                                M26 9V6
                                a2 2 0 0 0-2-2h-3

                                M9 4H6
                                a2 2 0 0 0-2 2v3

                                M21 26h3
                                a2 2 0 0 0 2-2v-3

                                M4 21v3
                                a2 2 0 0 0 2 2h3
                            "
                        />

                    </g>

                </svg>


                <!-- TRES ANILLOS -->

                <div class="circle green"></div>

                <div class="circle blue"></div>

                <div class="circle purple"></div>


                <!-- CHECK -->

                <svg
                    class="face-id-check"
                    viewBox="0 0 80 80"
                >

                    <path
                        class="path-tick"
                        d="M25,45 35,55 60,30"
                        stroke="#fff"
                        stroke-width="5"
                        fill="none"
                        stroke-linecap="butt"
                        stroke-linejoin="butt"
                    />

                </svg>

            </div>

        </div>

    </div>


    <script>

        const faceBtn =
            document.getElementById("faceBtn");

        const faceModal =
            document.getElementById("faceModal");

        const faceId =
            document.getElementById("faceId");


        let running = false;


        /*
         * SONIDO
         */

        function playUnlockSound() {

            try {

                const AudioContext =
                    window.AudioContext ||
                    window.webkitAudioContext;

                const context =
                    new AudioContext();

                const oscillator =
                    context.createOscillator();

                const gain =
                    context.createGain();


                oscillator.type = "sine";

                oscillator.frequency.setValueAtTime(
                    880,
                    context.currentTime
                );

                oscillator.frequency.exponentialRampToValueAtTime(
                    1320,
                    context.currentTime + 0.09
                );


                gain.gain.setValueAtTime(
                    0.0001,
                    context.currentTime
                );

                gain.gain.exponentialRampToValueAtTime(
                    0.12,
                    context.currentTime + 0.015
                );

                gain.gain.exponentialRampToValueAtTime(
                    0.0001,
                    context.currentTime + 0.16
                );


                oscillator.connect(gain);

                gain.connect(
                    context.destination
                );


                oscillator.start();

                oscillator.stop(
                    context.currentTime + 0.17
                );

            } catch (error) {

                console.log(
                    "Audio no disponible."
                );

            }

        }


        /*
         * VIBRACIÓN
         */

        function vibrateUnlock() {

            if (
                "vibrate" in navigator
            ) {

                navigator.vibrate([
                    35,
                    25,
                    60
                ]);

            }

        }


        /*
         * INICIO
         */

        faceBtn.addEventListener(
            "click",
            function () {

                if (running) {
                    return;
                }

                running = true;


                faceModal.classList.add(
                    "active"
                );


                faceId.classList.remove(
                    "active"
                );

                faceId.classList.remove(
                    "completed"
                );


                /*
                 * Forzamos reinicio de la
                 * animación CSS.
                 */

                void faceId.offsetWidth;


                /*
                 * Comienza la animación
                 */

                faceId.classList.add(
                    "active"
                );


                /*
                 * La animación dura
                 * exactamente 2.3 segundos.
                 */

                setTimeout(
                    function () {

                        /*
                         * CHECK
                         */

                        faceId.classList.add(
                            "completed"
                        );


                        /*
                         * Vibración
                         */

                        vibrateUnlock();


                        /*
                         * Sonido
                         */

                        playUnlockSound();


                        /*
                         * Esperamos a que
                         * termine de dibujarse
                         * el check y redirigimos
                         */

                        setTimeout(
                            function () {

                                /*
                                 * REDIRECCIÓN AUTOMÁTICA
                                 */

                                window.location.href =
                                    "index.html";

                            },
                            650
                        );

                    },
                    2300
                );

            }
        );

    </script>

</body>
</html>
