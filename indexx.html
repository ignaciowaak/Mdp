<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">

    <title>Demo - Ingreso</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #111111;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        /* =====================================================
           CONTENEDOR PRINCIPAL
        ===================================================== */

        .app-container {
            width: 100%;
            max-width: 410px;
            min-height: 100vh;

            background-color: #ffffff;

            display: flex;
            flex-direction: column;

            padding: 24px 28px;

            position: relative;

            justify-content: flex-start;
        }

        /* =====================================================
           STATUS BAR
        ===================================================== */

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;

            width: 100%;

            font-size: 15px;
            font-weight: 600;

            padding: 8px 0 20px;

            color: #000000;
        }

        .status-icons {
            display: flex;
            align-items: center;

            gap: 6px;

            font-size: 13px;
        }

        /* =====================================================
           HEADER
        ===================================================== */

        .header-section {
            display: flex;
            align-items: center;

            gap: 16px;

            margin-top: 10px;
            margin-bottom: 24px;
        }

        .avatar {
            width: 58px;
            height: 58px;

            background-color: #ff8c00;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            flex-shrink: 0;
        }

        .avatar svg {
            width: 100%;
            height: 100%;
        }

        .greeting {
            font-size: 26px;
            font-weight: 700;

            color: #1a1a1a;

            letter-spacing: -0.6px;
        }

        .subtitle {
            font-size: 16px;

            color: #1a1a1a;

            margin-bottom: 36px;

            font-weight: 400;
        }

        /* =====================================================
           PIN
        ===================================================== */

        .pin-indicators {
            display: flex;

            justify-content: space-between;

            width: 100%;

            padding: 0 10px;

            margin-bottom: 35px;
        }

        .pin-line {
            width: 36px;
            height: 2px;

            background-color: #111111;

            border-radius: 10px;
        }

        /* =====================================================
           RECUPERACIÓN
        ===================================================== */

        .recovery-link {
            text-align: center;

            color: #6a1b9a;

            font-size: 15px;
            font-weight: 600;

            text-decoration: none;

            margin-bottom: 40px;

            display: inline-block;

            width: 100%;
        }

        /* =====================================================
           BOTÓN FACE ID
        ===================================================== */

        .face-id-btn {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 10px;

            background: none;

            border: none;

            cursor: pointer;

            color: #6a1b9a;

            font-size: 15px;
            font-weight: 600;

            width: 100%;

            padding: 10px;
        }

        .face-id-btn svg {
            width: 22px;
            height: 22px;

            fill: #6a1b9a;
        }

        /* =====================================================
           OVERLAY
        ===================================================== */

        .face-modal-overlay {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background-color: rgba(0, 0, 0, 0.45);

            display: flex;

            justify-content: center;
            align-items: flex-start;

            padding-top: 130px;

            opacity: 0;

            visibility: hidden;

            transition:
                opacity 0.25s ease,
                visibility 0.25s ease;

            z-index: 1000;
        }

        .face-modal-overlay.active {

            opacity: 1;

            visibility: visible;
        }

        /* =====================================================
           CONTENEDOR FACE ID
        ===================================================== */

        .face-scanner-card {

            position: relative;

            width: 96px;
            height: 96px;

            background:
                linear-gradient(
                    145deg,
                    #292929,
                    #111111
                );

            border-radius: 25px;

            display: flex;

            justify-content: center;
            align-items: center;

            box-shadow:
                0 14px 35px rgba(0,0,0,.40),
                inset 0 1px 1px rgba(255,255,255,.08);

            transform: scale(.82);

            opacity: 0;

            transition:
                transform .35s cubic-bezier(.175,.885,.32,1.275),
                opacity .2s ease;
        }

        .face-modal-overlay.active
        .face-scanner-card {

            transform: scale(1);

            opacity: 1;
        }

        /* =====================================================
           BORDE DE ESCANEO
        ===================================================== */

        .scanner-border {

            position: absolute;

            inset: -4px;

            border-radius: 29px;

            border: 2px solid transparent;

            background:
                linear-gradient(
                    #111111,
                    #111111
                ) padding-box,

                conic-gradient(
                    from 0deg,
                    transparent 0deg,
                    transparent 35deg,
                    #00e676 65deg,
                    #ffffff 90deg,
                    #00e676 115deg,
                    transparent 150deg,
                    transparent 360deg
                ) border-box;

            animation:
                rotateScanner 1.15s linear infinite;

            filter:
                drop-shadow(
                    0 0 5px rgba(0,230,118,.8)
                );
        }

        @keyframes rotateScanner {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* =====================================================
           CARA DE FACE ID
        ===================================================== */

        .face-symbol {

            position: relative;

            width: 55px;
            height: 55px;

            display: flex;

            justify-content: center;
            align-items: center;

            z-index: 3;
        }

        /* =====================================================
           CÍRCULOS DE LA CARA
        ===================================================== */

        .face-symbol .eye {

            position: absolute;

            width: 7px;
            height: 7px;

            background: #ffffff;

            border-radius: 50%;

            box-shadow:
                0 0 5px rgba(255,255,255,.75);

            animation:
                eyePulse 1.3s ease-in-out infinite;
        }

        .face-symbol .eye.left {

            left: 14px;
            top: 18px;
        }

        .face-symbol .eye.right {

            right: 14px;
            top: 18px;
        }

        @keyframes eyePulse {

            0%,
            100% {
                transform: scale(.9);
                opacity: .8;
            }

            50% {
                transform: scale(1.15);
                opacity: 1;
            }
        }

        /* =====================================================
           PUNTOS DEL ROSTRO
        ===================================================== */

        .face-dot {

            position: absolute;

            width: 4px;
            height: 4px;

            border-radius: 50%;

            background: #ffffff;

            opacity: .85;

            box-shadow:
                0 0 5px rgba(255,255,255,.7);
        }

        .dot-1 {
            left: 9px;
            top: 27px;
        }

        .dot-2 {
            right: 9px;
            top: 27px;
        }

        .dot-3 {
            left: 18px;
            bottom: 11px;
        }

        .dot-4 {
            left: 26px;
            bottom: 7px;
        }

        .dot-5 {
            right: 18px;
            bottom: 11px;
        }

        /* =====================================================
           NARIZ / CENTRO
        ===================================================== */

        .face-symbol .nose {

            position: absolute;

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: #ffffff;

            top: 29px;
            left: 50%;

            transform: translateX(-50%);

            box-shadow:
                0 0 5px rgba(255,255,255,.75);
        }

        /* =====================================================
           BOCA
        ===================================================== */

        .face-symbol .mouth {

            position: absolute;

            width: 16px;
            height: 7px;

            left: 50%;
            bottom: 15px;

            transform: translateX(-50%);

            border-bottom: 2px solid #ffffff;

            border-radius: 0 0 50% 50%;
        }

        /* =====================================================
           CÍRCULO INTERNO
        ===================================================== */

        .face-symbol::before {

            content: "";

            position: absolute;

            width: 42px;
            height: 42px;

            border:

                1px solid
                rgba(255,255,255,.20);

            border-radius: 50%;

            animation:
                faceCircle 2s ease-in-out infinite;
        }

        @keyframes faceCircle {

            0%,
            100% {
                transform: scale(.92);
                opacity: .45;
            }

            50% {
                transform: scale(1.08);
                opacity: .9;
            }
        }

        /* =====================================================
           LÍNEA DE ESCANEO
        ===================================================== */

        .face-scan-line {

            position: absolute;

            left: 17px;
            right: 17px;

            height: 1px;

            top: 10px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #00e676,
                    #ffffff,
                    #00e676,
                    transparent
                );

            box-shadow:
                0 0 6px #00e676,
                0 0 12px rgba(0,230,118,.8);

            opacity: .95;

            z-index: 5;

            animation:
                faceScanning 1.7s
                cubic-bezier(.4,0,.2,1)
                infinite;
        }

        @keyframes faceScanning {

            0% {
                top: 13px;
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            50% {
                top: 78px;
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                top: 13px;
                opacity: 0;
            }
        }

        /* =====================================================
           PARTÍCULAS
        ===================================================== */

        .scan-particle {

            position: absolute;

            width: 3px;
            height: 3px;

            background: #00e676;

            border-radius: 50%;

            box-shadow:
                0 0 6px #00e676;

            opacity: 0;
        }

        .particle-1 {

            left: 17px;
            top: 22px;

            animation:
                particleMove 1.8s
                ease-in-out
                infinite;
        }

        .particle-2 {

            right: 18px;
            top: 44px;

            animation:
                particleMove 1.5s
                .25s
                ease-in-out
                infinite;
        }

        .particle-3 {

            left: 25px;
            bottom: 17px;

            animation:
                particleMove 1.6s
                .45s
                ease-in-out
                infinite;
        }

        .particle-4 {

            right: 26px;
            bottom: 23px;

            animation:
                particleMove 1.9s
                .1s
                ease-in-out
                infinite;
        }

        @keyframes particleMove {

            0% {
                opacity: 0;
                transform: scale(.4);
            }

            30% {
                opacity: 1;
            }

            70% {
                opacity: .8;
            }

            100% {
                opacity: 0;
                transform: scale(1.5);
            }
        }

        /* =====================================================
           ESTADO
        ===================================================== */

        .face-status {

            position: absolute;

            top: 108px;

            left: 50%;

            transform:
                translateX(-50%)
                translateY(5px);

            white-space: nowrap;

            color: #ffffff;

            font-size: 13px;

            font-weight: 500;

            opacity: 0;

            transition:
                opacity .25s ease,
                transform .25s ease;
        }

        .face-modal-overlay.active
        .face-status {

            opacity: 1;

            transform:
                translateX(-50%)
                translateY(0);
        }

        /* =====================================================
           ESTADO VERIFICADO
        ===================================================== */

        .face-scanner-card.success
        .scanner-border {

            background:
                linear-gradient(
                    #111111,
                    #111111
                ) padding-box,

                linear-gradient(
                    #00e676,
                    #00e676
                ) border-box;

            animation: none;

            filter:
                drop-shadow(
                    0 0 8px
                    rgba(0,230,118,.8)
                );
        }

        .face-scanner-card.success
        .face-symbol {

            transform: scale(.82);

            opacity: 0;

            transition:
                transform .25s ease,
                opacity .2s ease;
        }

        .success-check {

            position: absolute;

            width: 45px;
            height: 45px;

            border-radius: 50%;

            background: #00e676;

            display: flex;

            justify-content: center;
            align-items: center;

            transform: scale(0);

            opacity: 0;

            z-index: 10;

            transition:
                transform .35s
                cubic-bezier(.175,.885,.32,1.275),
                opacity .2s ease;
        }

        .success-check::after {

            content: "";

            width: 20px;
            height: 10px;

            border-left:
                3px solid #111111;

            border-bottom:
                3px solid #111111;

            transform:
                rotate(-45deg)
                translateY(-2px);
        }

        .face-scanner-card.success
        .success-check {

            transform: scale(1);

            opacity: 1;
        }

        .face-scanner-card.success
        .face-scan-line {

            display: none;
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 430px) {

            .app-container {
                padding-left: 24px;
                padding-right: 24px;
            }

        }

    </style>
</head>

<body>

    <!-- =====================================================
         PANTALLA PRINCIPAL
    ===================================================== -->

    <div class="app-container">

        <div class="status-bar">

            <span class="time">
                4:57
            </span>

            <div class="status-icons">

                <span>••••</span>
                <span>📶</span>
                <span>🔋</span>

            </div>

        </div>


        <div class="header-section">

            <div class="avatar">

                <svg viewBox="0 0 100 100">

                    <circle
                        cx="50"
                        cy="50"
                        r="50"
                        fill="#ff8c00"
                    />

                    <path
                        d="M22,28 L10,10 L34,20 Z"
                        fill="#e65100"
                    />

                    <path
                        d="M78,28 L90,10 L66,20 Z"
                        fill="#e65100"
                    />

                    <path
                        d="M50,14 L50,30
                           M38,18 L44,28
                           M62,18 L56,28"
                        stroke="#261200"
                        stroke-width="4.5"
                        stroke-linecap="round"
                    />

                    <circle
                        cx="34"
                        cy="45"
                        r="6"
                        fill="#261200"
                    />

                    <circle
                        cx="66"
                        cy="45"
                        r="6"
                        fill="#261200"
                    />

                    <circle
                        cx="36"
                        cy="43"
                        r="2"
                        fill="#ffffff"
                    />

                    <circle
                        cx="68"
                        cy="43"
                        r="2"
                        fill="#ffffff"
                    />

                    <polygon
                        points="50,55 43,64 57,64"
                        fill="#261200"
                    />

                    <path
                        d="M50,64
                           L50,73
                           M50,73
                           C45,73 43,69 40,69
                           M50,73
                           C55,73 57,69 60,69"
                        stroke="#261200"
                        stroke-width="3"
                        fill="none"
                        stroke-linecap="round"
                    />

                    <line
                        x1="24"
                        y1="65"
                        x2="8"
                        y2="61"
                        stroke="#261200"
                        stroke-width="3.5"
                        stroke-linecap="round"
                    />

                    <line
                        x1="24"
                        y1="73"
                        x2="8"
                        y2="73"
                        stroke="#261200"
                        stroke-width="3.5"
                        stroke-linecap="round"
                    />

                    <line
                        x1="76"
                        y1="65"
                        x2="92"
                        y2="61"
                        stroke="#261200"
                        stroke-width="3.5"
                        stroke-linecap="round"
                    />

                    <line
                        x1="76"
                        y1="73"
                        x2="92"
                        y2="73"
                        stroke="#261200"
                        stroke-width="3.5"
                        stroke-linecap="round"
                    />

                </svg>

            </div>

            <h1 class="greeting">
                Hola
            </h1>

        </div>


        <div class="subtitle">
            Ingresá con tu clave
        </div>


        <div class="pin-indicators">

            <div class="pin-line"></div>
            <div class="pin-line"></div>
            <div class="pin-line"></div>
            <div class="pin-line"></div>
            <div class="pin-line"></div>
            <div class="pin-line"></div>

        </div>


        <a
            href="#"
            class="recovery-link"
        >
            ¿Olvidaste tu clave?
        </a>


        <button
            class="face-id-btn"
            id="faceBtn"
            type="button"
        >

            <svg viewBox="0 0 24 24">

                <path d="
                    M9 3H5
                    a2 2 0 0 0-2 2
                    v4h2V5h4V3

                    m6 0h4
                    a2 2 0 0 1 2 2
                    v4h-2V5h-4V3

                    M3 15v4
                    a2 2 0 0 0 2 2
                    h4v-2H5v-4H3

                    m18 0v4
                    h-4v2h4
                    a2 2 0 0 0 2-2
                    v-4h-2
                " />

            </svg>

            Ingresá con reconocimiento facial

        </button>

    </div>


    <!-- =====================================================
         MODAL FACE ID
    ===================================================== -->

    <div
        class="face-modal-overlay"
        id="faceModal"
    >

        <div
            class="face-scanner-card"
            id="faceScanner"
        >

            <!-- Borde animado -->

            <div class="scanner-border"></div>


            <!-- Símbolo facial -->

            <div class="face-symbol">

                <div class="eye left"></div>
                <div class="eye right"></div>

                <div class="nose"></div>

                <div class="mouth"></div>

                <div class="face-dot dot-1"></div>
                <div class="face-dot dot-2"></div>
                <div class="face-dot dot-3"></div>
                <div class="face-dot dot-4"></div>
                <div class="face-dot dot-5"></div>

            </div>


            <!-- Línea de reconocimiento -->

            <div class="face-scan-line"></div>


            <!-- Partículas -->

            <div class="scan-particle particle-1"></div>
            <div class="scan-particle particle-2"></div>
            <div class="scan-particle particle-3"></div>
            <div class="scan-particle particle-4"></div>


            <!-- Check -->

            <div class="success-check"></div>


            <!-- Texto -->

            <div
                class="face-status"
                id="faceStatus"
            >
                Analizando…
            </div>

        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->

    <script>

        const faceBtn =
            document.getElementById("faceBtn");

        const faceModal =
            document.getElementById("faceModal");

        const faceScanner =
            document.getElementById("faceScanner");

        const faceStatus =
            document.getElementById("faceStatus");


        let scanning = false;


        faceBtn.addEventListener(
            "click",
            () => {

                if (scanning) {
                    return;
                }

                scanning = true;


                /*
                 * Abrir Face ID
                 */

                faceModal.classList.add(
                    "active"
                );


                faceScanner.classList.remove(
                    "success"
                );


                /*
                 * Primera etapa
                 */

                faceStatus.textContent =
                    "Analizando…";


                /*
                 * Rostro detectado
                 */

                setTimeout(() => {

                    faceStatus.textContent =
                        "Rostro detectado";

                }, 850);


                /*
                 * Verificación
                 */

                setTimeout(() => {

                    faceStatus.textContent =
                        "Verificando…";

                }, 1450);


                /*
                 * Éxito
                 */

                setTimeout(() => {

                    faceScanner.classList.add(
                        "success"
                    );

                    faceStatus.textContent =
                        "Verificado";

                }, 2050);


                /*
                 * Redirección
                 */

                setTimeout(() => {

                    window.location.href =
                        "dashboard.html";

                }, 2800);

            }
        );

    </script>

</body>
